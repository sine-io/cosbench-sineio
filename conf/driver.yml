# Local Java 21 shadow configuration. Set auth.token.env/file and auth.tls for service deployments.
schemaVersion: 1
role: driver
name: driver1
listen:
  host: 127.0.0.1
  port: 18088
  contextPath: /driver
paths:
  workspace: workspace
  archive: archive
  mission: log/mission
  logs: log/system.log
auth:
  tls:
    enabled: false
http:
  pool:
    maxConnections: 24
    maxPerRoute: 8
    idleTimeout: 45s
  timeouts:
    connect: 2s
    read: 30s
    command: 60s
    workload: 1h
  retries:
    maxAttempts: 3
    backoff: 250ms
concurrency: 2
provider:
  name: mock
  concurrency: 2
logging:
  level: INFO
  file: log/system.log
web:
  enabled: true
  maxUploadBytes: 10485760
shutdown:
  gracePeriod: 15s
