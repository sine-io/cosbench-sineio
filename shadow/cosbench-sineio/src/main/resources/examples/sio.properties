# storage type="sio"
# Reference values for the storage config attribute; render placeholders before use.
# The provider accepts semicolon-separated key=value pairs, not this properties file directly.
endpoint=${SINEIO_ENDPOINT}
accesskey=${SINEIO_ACCESS_KEY}
secretkey=${SINEIO_SECRET_KEY}
timeout=30000
max_connections=50
path_style_access=true
no_verify_ssl=false
restore_days=1
part_size=5242880
storage_class=STANDARD
is_prefetch=false
is_range_request=false
file_length=4000000
chunk_length=1000000
aws_region=us-east-1
