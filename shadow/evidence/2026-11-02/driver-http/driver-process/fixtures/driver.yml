schemaVersion: 1
role: driver
name: Driver executable replay
listen:
  host: 127.0.0.1
  port: 19488
  contextPath: /driver
paths:
  workspace: workspace
  archive: archive
  mission: missions
  logs: log/system.log
auth:
  token:
    env: COSBENCH_HTTP_SERVICE_TOKEN
  tls:
    enabled: true
    keyStore: file:/run/secrets/http_test_keystore
logging:
  level: INFO
  file: log/system.log
shutdown:
  gracePeriod: 5s
